<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Chat Assistant</title>

<style>
body { font-family: Arial; max-width: 700px; margin: auto; padding: 20px; }
#chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; }
input { width: 80%; padding: 10px; }
button { padding: 10px; }
.user { color: blue; }
.ai { color: green; }
</style>
</head>

<body>

<h2>AI Chat Assistant</h2>

<div id="chat"></div>

<input id="input" placeholder="Type something...">
<button onclick="sendMessage()">Send</button>

<script>

async function sendMessage() {
    let input = document.getElementById("input").value;
    let chat = document.getElementById("chat");

    chat.innerHTML += `<p class="user">You: ${input}</p>`;

    try {
        let response = await fetch("http://localhost:3000/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: input })
        });

        let data = await response.json();

        chat.innerHTML += `<p class="ai">AI: ${data.reply}</p>`;
    } catch (error) {
        chat.innerHTML += `<p class="ai">Error connecting to server</p>`;
    }

    document.getElementById("input").value = "";
}

</script>

</body>
</html>
