<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Chat Assistant</title>
<style>
body { font-family: Arial; max-width: 700px; margin: auto; padding: 20px; }
#chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; }
input { width: 80%; padding: 10px; }
button { padding: 10px; }
.user { color: blue; }
.ai { color: green; }
</style>
</head>

<body>

<h2>AI Chat Assistant</h2>

<div id="chat"></div>

<input id="input" placeholder="Type something...">
<button onclick="sendMessage()">Send</button>

<script>

const API_KEY = "YOUR_NEW_KEY_HERE"; // ⚠️ 你替换这里

async function sendMessage() {
    let input = document.getElementById("input").value;
    let chat = document.getElementById("chat");

    chat.innerHTML += `<p class="user">You: ${input}</p>`;

    let response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + API_KEY
        },
        body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
                { role: "system", content: "You are a helpful assistant." },
                { role: "user", content: input }
            ]
        })
    });

    let data = await response.json();
    let reply = data.choices[0].message.content;

    chat.innerHTML += `<p class="ai">AI: ${reply}</p>`;

    document.getElementById("input").value = "";
}

</script>

</body>
</html>
