<!DOCTYPE html>
<html>
<head>
    <title>AI Chat Assistant</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }
        #chat {
            border: 1px solid #ccc;
            padding: 10px;
            width: 400px;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }
        input {
            width: 300px;
            padding: 8px;
        }
        button {
            padding: 8px;
        }
    </style>
</head>
<body>

<h2>AI Chat Assistant</h2>

<div id="chat"></div>

<input type="text" id="input" placeholder="Type a message...">
<button onclick="send()">Send</button>

<script>
function send() {
    let input = document.getElementById("input").value;

    if (!input) return;

    let chat = document.getElementById("chat");

    chat.innerHTML += "<p><b>You:</b> " + input + "</p>";

    let reply = "AI: I received your message: " + input;

    chat.innerHTML += "<p><b>" + reply + "</b></p>";

    document.getElementById("input").value = "";
}
</script>

</body>
</html>
